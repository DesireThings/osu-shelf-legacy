# One grouped PR per ecosystem per month, so updates arrive in a batch we can
# review together instead of a trickle. Security updates are not held to this
# schedule: GitHub opens those as soon as an advisory lands.
#
# The vendor/realm-cpp submodule is deliberately not listed: it is pinned to a
# commit the realm bindings are built and tested against.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns: ["*"]

  # One workspace, one Cargo.lock at the root (the CLI, the desktop crate and
  # osu-downloader).
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    # osu-db's newest code is 0.2.1: the higher 0.3.0 can't read a current
    # osu!.db (see the pin in Cargo.toml). Lift this when a release above 0.3.0
    # carries the fix.
    ignore:
      - dependency-name: osu-db
    groups:
      cargo:
        patterns: ["*"]

  # The desktop frontend; pnpm is picked up from gui/pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /gui
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    # svelte-check can't run on TypeScript 7 alone (it wants 6 and 7 installed
    # together, plus --tsgo), so a major bump is a job of its own.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
